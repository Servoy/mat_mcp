name: Build and deploy Eclipse update site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build update site with Tycho
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Assemble GitHub Pages content
        run: |
          mkdir -p deploy
          # the p2 repository (features/, plugins/, artifacts.*, content.*, p2.index)
          cp -r com.servoy.mat.mcp.repository/target/repository/. deploy/
          # the landing page
          cp site/index.html deploy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
